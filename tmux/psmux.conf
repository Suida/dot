# List of plugins
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-pain-control'
set -g @plugin 'psmux-plugins/psmux-battery'
set -g @plugin 'psmux-plugins/psmux-cpu'
set -g @plugin 'psmux-plugins/psmux-sidebar'
set -g @plugin 'psmux-plugins/psmux-logging'
set -g @plugin 'psmux-plugins/psmux-theme-rosepine'

# Replace prefix with C-s
unbind C-b
# Disable 
unbind C-s
unbind C-r
set-option -g prefix C-s
bind-key C-s send-prefix
# Save psmux environment
bind-key S run-shell 'pwsh -NoProfile -ExecutionPolicy Bypass -File "~/.psmux/plugins/psmux-resurrect/scripts/save.ps1"'
# Restore psmux environment
bind-key R run-shell 'pwsh -NoProfile -ExecutionPolicy Bypass -File "~/.psmux/plugins/psmux-resurrect/scripts/restore.ps1"'

# Split panes using | and -
bind | split-window -h
bind - split-window -v

# Reload config file
bind r source-file ~/.psmux.conf

# switch panes using Alt-arrow without prefix
bind C-a last-window

bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

bind -T copy-mode-vi i send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'win32yank.exe -i --crlf'

bind C-h previous-window
bind C-l next-window

# Choose variant (main/moon/dawn)
set -g @rosepine-variant 'dawn'
# Enable powerline separators
set -g @rosepine-show-powerline 'on'
# Separator style: arrow, rounded, or slant
set -g @rosepine-separator 'arrow'
# Enable Nerd Font icons
set -g @rosepine-show-icons 'on'
# Left section icon: session, window, or rocket
set -g @rosepine-left-icon 'session'
# Show username in status left
set -g @rosepine-show-user 'on'

# Starting index of tabs and panes
set -g base-index 1
setw -g pane-base-index 1

set -g mode-keys vi

set -g allow-predictions on
# Cursor style: block, underline, or bar
set -g cursor-style bar
set -g cursor-blink on

# Initialize PPM (keep this line at the very bottom of psmux.conf)
run '~/.psmux/plugins/ppm/ppm.ps1'

# Load Rose Pine variant dynamically after PPM (plugin.conf only sets the static main palette)
run-shell 'pwsh -NoProfile -ExecutionPolicy Bypass -File "~/.psmux/plugins/psmux-theme-rosepine/psmux-theme-rosepine.ps1"'

unbind C-v
